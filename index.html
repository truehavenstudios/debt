:root{
  --bg:#F8F4F0;--bg2:#F1EBE5;--card:#FFFFFF;--ink:#2F2A27;--ink2:#6A615B;--ink3:#8C837C;
  --line:#EAE2DA;--line2:#DCD2C8;--shadow:0 1px 2px rgba(70,50,40,.05),0 10px 30px rgba(70,50,40,.06);
  --a:#94665F;--a1:#F4E6E3;--a2:#E7CDC8;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC;
  --ok:#3F6E48;--okbg:#E0EDE2;--warn:#86601B;--warnbg:#F6EBD3;--bad:#A0412F;--badbg:#F6DFDA;
  --p1:#E7A1A6;--p2:#9DCBA6;--p3:#B5A3D8;--p4:#97BFE0;--p5:#E3C08E;--p6:#F0AE95;--p7:#8FCFC6;--p8:#D39CC4;--p9:#C2C08A;--p10:#A3B1C4;
  --r:20px;--fs:16px;--serif:"Bodoni",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[data-theme="Sage"]{--a:#5E7C64;--a1:#E5EEE6;--a2:#C9DDCC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Lavender"]{--a:#76689A;--a1:#ECE7F4;--a2:#D6CCE8;--b:#4F7193;--b1:#E3ECF5;--b2:#C8D9EA}
[data-theme="Sky"]{--a:#4F7193;--a1:#E3ECF5;--a2:#C8D9EA;--b:#76689A;--b1:#ECE7F4;--b2:#D6CCE8}
[data-theme="Sand"]{--a:#8A6D4E;--a1:#F2E9DE;--a2:#E3D2BD;--b:#5E7C64;--b1:#E5EEE6;--b2:#C9DDCC}
[data-theme="Stone"]{--a:#6B635D;--a1:#EEEAE6;--a2:#DAD3CC;--b:#94665F;--b1:#F4E6E3;--b2:#E7CDC8}
[data-theme="Mocha"]{--a:#6F5146;--a1:#F1E6E0;--a2:#DDC8BE;--b:#A3603F;--b1:#F7E7DD;--b2:#ECCDB9}
[data-theme="Ocean"]{--a:#3F6B78;--a1:#E1EDF0;--a2:#C3DAE0;--b:#8A6D4E;--b1:#F2E9DE;--b2:#E3D2BD}
[data-theme="Plum"]{--a:#73465F;--a1:#F2E5EC;--a2:#E2C8D6;--b:#9A5F7E;--b1:#F6E8EF;--b2:#EBCFDD}
[data-theme="Noir"]{--a:#34302D;--a1:#ECE8E3;--a2:#D9D2C9;--b:#8C6F3A;--b1:#F4ECDC;--b2:#E6D5B2}
html[data-dark="1"]{
  --bg:#1B1918;--bg2:#24211F;--card:#2A2725;--ink:#F3EEEA;--ink2:#BDB4AD;--ink3:#8D847D;--line:#38332F;--line2:#4A443F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --ok:#9CC8A5;--okbg:#2B3A2E;--warn:#E3BA72;--warnbg:#3D3324;--bad:#EC9E8F;--badbg:#45302B;color-scheme:dark;
}
/* the theme sits on <body>; dark tints must be set there too or the light tints win */
html[data-dark="1"] body[data-theme],html[data-dark="1"]{--a1:color-mix(in srgb,var(--a) 30%,#2A2725);--a2:color-mix(in srgb,var(--a) 50%,#9A928B);--b1:color-mix(in srgb,var(--b) 30%,#2A2725);--b2:color-mix(in srgb,var(--b) 50%,#9A928B)}
html[data-dark="1"] body[data-theme="Noir"]{--a:#57504A}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs);line-height:1.45}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;letter-spacing:.01em}
h1{font-size:2.1em;line-height:1.08;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:1.3em;line-height:1.2}
h3{font-size:1.05em}
.caps{font-size:.72em;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.small{font-size:.87em}.tiny{font-size:.77em}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.hidden{display:none!important}
.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}

/* ------------------------------------------------ layout */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:250px;flex:none;padding:24px 14px 20px;border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:1px}
.brand{padding:2px 12px 16px}
.brand .k{font-size:.62em;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.32em;display:block;line-height:1.1;margin-top:3px;letter-spacing:.02em}
.brand .arch{width:30px;height:34px;color:var(--a);margin-bottom:8px}
.navlabel{padding:14px 12px 5px;font-size:.64em}
.nav{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:11px;color:var(--ink);text-decoration:none;font-size:.94em;border:0;background:none;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none;color:var(--ink2)}
.nav:hover{background:var(--bg2)}
.nav.on{background:var(--a);color:#fff;font-weight:500}
.nav.on svg{color:#fff}
.nav .badge{margin-left:auto}
.side .addbtn{margin:2px 0 6px;justify-content:center}
.main{flex:1;min-width:0;padding:28px 36px 120px;max-width:1240px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar .sub{margin-top:5px}
.topbar .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.sb{justify-content:space-between}.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.tabbar{display:none}
.mt{margin-top:18px}.mt0{margin-top:0}

/* ------------------------------------------------ cards with a colored title band (our signature) */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);min-width:0;overflow:hidden}
.card>.band{background:var(--a);color:#fff;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.card>.band.b{background:var(--b)}
.card>.band.soft{background:var(--a1);color:var(--ink)}
.card>.band.softb{background:var(--b1);color:var(--ink)}
.band .t{font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.band .r{font-size:.8em;opacity:.9;display:flex;gap:8px;align-items:center}
.band .lnk{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:20px;padding:4px 11px;font-size:.92em}
.band.soft .lnk,.band.softb .lnk{background:var(--card)}
.card>.body{padding:18px 20px}
.card>.body.tight{padding:8px 20px 12px}
.card.pad{padding:18px 20px}
.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
/* key number tiles (like the spreadsheet) */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);text-align:center;min-width:0;display:flex;flex-direction:column}
.tile>b{flex:1;display:flex!important;align-items:center;justify-content:center;padding:8px!important}
.grid.start{align-items:start}
.tiles{grid-auto-rows:1fr}
.tile .h{background:var(--a1);font-size:.66em;letter-spacing:.16em;text-transform:uppercase;font-weight:500;padding:8px 6px;color:var(--ink)}
.tile:nth-child(even) .h{background:var(--b1)}
.tile b{display:block;font-family:var(--serif);font-weight:500;font-size:1.65em;padding:10px 8px 2px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:.78em;color:var(--ink2);padding:0 8px 11px}
.tile .s.ok{color:var(--ok)}.tile .s.bad{color:var(--bad)}

/* hero: safe to spend */
.hero{background:var(--b1);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--b2) 60%,transparent);text-align:center;display:flex;flex-direction:column}
.hero .band{background:var(--b);color:#fff;padding:11px 16px;font-size:.74em;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.hero .in{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-family:var(--serif);font-weight:500;font-size:3.9em;line-height:1;letter-spacing:-.01em;display:inline-flex;align-items:flex-start;gap:2px;font-variant-numeric:tabular-nums}
.big .cur{font-size:.4em;margin-top:.3em;opacity:.7}
.big .ct{font-size:.4em;margin-top:.3em;opacity:.7}
.big.neg{color:var(--bad)}
.hero .line{color:var(--b);font-weight:500;margin-top:8px;font-size:.98em}
html[data-dark="1"] .hero .line{color:var(--ink)}
.hero .math{margin-top:12px;background:var(--card);border-radius:14px;padding:9px 14px;font-size:.84em;width:100%;max-width:340px;text-align:left}
.hero .math div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.hero .math .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:500}
.hero .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--card);border-radius:30px;padding:9px 16px;font-size:.92em;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--a)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.pri2{background:var(--b);border-color:var(--b);color:#fff}
.btn.soft{background:var(--a1);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:.84em}
.btn.danger{color:var(--bad)}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;cursor:default}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.iconbtn:hover{background:var(--bg2);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.link{border:0;background:none;padding:0;color:var(--a);text-decoration:underline;text-underline-offset:3px;font-size:.88em;cursor:pointer}
html[data-dark="1"] .link{color:var(--a2)}
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 9px;font-size:max(11.5px,.74em);font-weight:500;background:var(--a1);color:var(--ink);white-space:nowrap}
.badge.b{background:var(--b1)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.seg{display:inline-flex;background:var(--bg2);border-radius:30px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:30px;padding:6px 13px;font-size:.86em;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:500}
.monthpick{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line2);border-radius:30px;padding:3px}
.monthpick b{font-weight:500;min-width:128px;text-align:center;font-size:.94em}
.monthpick .iconbtn{width:30px;height:30px;border-radius:50%}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.click{cursor:pointer}
.item.click:hover .nm{text-decoration:underline;text-underline-offset:3px}
.nm{font-weight:500}
.date{width:44px;flex:none;text-align:center;border-radius:11px;background:var(--bg2);padding:5px 0 4px;line-height:1.05}
.date b{display:block;font-family:var(--serif);font-weight:500;font-size:1.18em}
.date span{font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.date.a{background:var(--a1)}.date.b{background:var(--b1)}.date.ok{background:var(--okbg)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.amt.in{color:var(--ok)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.emo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:1.05em;background:var(--bg2)}
.empty{padding:22px;text-align:center;color:var(--ink2);border:1.5px dashed var(--line2);border-radius:14px;font-size:.92em}
.dayhead{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);padding:14px 0 4px;font-weight:500}
.dayhead:first-child{padding-top:0}
.tag{font-size:.72em;background:var(--b1);border-radius:10px;padding:1px 7px;margin-left:6px}
table.t{width:100%;border-collapse:collapse;font-size:.88em}
table.t th{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:500;text-align:right;padding:8px 6px;background:var(--b1);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:500;border-top:2px solid var(--line2)}
table.t td.over{background:var(--badbg);color:var(--bad)}
table.t td.cur{background:var(--a1)}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* progress */
.bar{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--b);transition:width .6s}
.bar.a i{background:var(--a)}
.bar.over i{background:var(--bad)}
.bar.thick{height:13px}
.bar.mark{position:relative;overflow:visible}
.bar.mark u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);border-radius:2px}
.budrow{padding:11px 0;border-top:1px solid var(--line)}
.budrow:first-child{border-top:0}
.budrow .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;align-items:baseline}
.budrow .sub2{display:flex;justify-content:space-between;font-size:.78em;color:var(--ink2);margin-top:4px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:.8em;color:var(--ink2);font-weight:500}
.inp{width:100%;border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:10px 13px;outline:none;font-size:1em;min-width:0}
.inp:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 16%,transparent)}
.inp.sm{padding:6px 9px;font-size:.9em;border-radius:9px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.help{font-size:.78em;color:var(--ink3)}
.switch{position:relative;width:44px;height:26px;border-radius:20px;background:var(--line2);border:0;padding:0;flex:none;transition:background .2s}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--b)}.switch.on:after{left:21px}
input[type=range]{width:100%;accent-color:var(--a)}
.erow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow:first-child{border-top:0}
.erow .e{width:54px;text-align:center;flex:none}.erow .n{flex:1 1 150px;min-width:0}.erow .a{width:100px;flex:none}.erow .g{width:110px;flex:none}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(40,30,25,.38);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s}
.modal{background:var(--card);border-radius:24px;width:100%;max-width:480px;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .22s}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 12px;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:1.2em}
.modal .mb{padding:16px 22px 18px}
.modal .mf{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}
.modal .mf .btn{flex:1 1 auto;justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}

/* add sheet */
.kind{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:12px}
.kind button{border:0;background:none;border-radius:11px;padding:8px;font-weight:500;color:var(--ink2)}
.kind button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amountview{text-align:center;padding:2px 0 6px}
.amountview input{border:0;background:none;text-align:center;font-family:var(--serif);font-size:2.8em;width:100%;outline:none;padding:0;font-variant-numeric:tabular-nums}
.plus{display:flex;gap:8px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
.plus button{border:0;background:var(--a1);border-radius:30px;padding:6px 13px;font-weight:500;font-size:.86em}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 12px}
.cat{border:1.5px solid var(--line2);background:var(--card);border-radius:30px;padding:6px 12px;font-size:.86em;display:inline-flex;gap:6px;align-items:center}
.cat.on{border-color:var(--a);background:var(--a1);font-weight:500}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#2F2A27;color:#fff;border-radius:16px;padding:11px 12px 11px 18px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.28);animation:pop .25s;max-width:calc(100vw - 28px);font-size:.92em}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;padding:6px 13px;font-weight:500}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.66em;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:center;padding:4px 0;font-weight:500}
.cday{min-height:96px;border-radius:12px;background:var(--bg2);padding:6px 7px;display:flex;flex-direction:column;gap:3px;border:1.5px solid transparent;min-width:0;text-align:left}
.cday.out{opacity:.3}
.cday.today{border-color:var(--a);background:var(--card)}
.cday.ns{background:var(--b1)}
.cday .d{font-size:.8em;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.ev{font-size:.68em;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--card);border-left:3px solid var(--a)}
.ev.income{border-left-color:var(--ok);background:var(--okbg)}
.ev.sub{border-left-color:var(--p3)}.ev.debt{border-left-color:var(--bad)}.ev.save{border-left-color:var(--b)}
.ev.spend{border-left:0;background:transparent;padding-left:1px;color:var(--ink2)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini i{aspect-ratio:1;border-radius:4px;background:var(--bg2);font-style:normal;font-size:.56em;display:grid;place-items:center;color:var(--ink3)}
.mini i.ns{background:var(--b);color:#fff}.mini i.sp{background:var(--a1);color:var(--ink2)}.mini i.x{background:none}
.minis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px 18px}
.minis h4{margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:.95em;display:flex;justify-content:space-between}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--ink2);font-size:10.5px}
.chart .grid line{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.86em}
.legend div{display:flex;align-items:center;gap:9px}
.legend .v{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:500;flex:none;white-space:nowrap}
.legend .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78em;color:var(--ink2);margin-top:8px}
.hleg span{display:inline-flex;align-items:center;gap:6px}
.hleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donutwrap{display:flex;gap:16px;align-items:center}
.donutwrap .legend{flex:1;min-width:0}
.flow{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.flow i{display:block;height:100%;min-width:3px}
.tip{position:fixed;z-index:80;background:#2F2A27;color:#fff;font-size:12px;border-radius:8px;padding:5px 9px;pointer-events:none;white-space:nowrap;transform:translate(-50%,-120%)}

/* goals */
.jar{width:44px;height:58px;flex:none}
.goal .bigsum{font-family:var(--serif);font-size:1.8em;line-height:1.1}
.bigdate{font-family:var(--serif);font-size:2.5em;line-height:1.05}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .iconbtn{border:1px solid var(--line2);border-radius:50%;width:30px;height:30px}

/* onboarding */
.ob{max-width:580px;margin:5vh auto;padding:0 18px 60px}
.ob .steps{display:flex;gap:6px;margin:0 0 22px}
.ob .steps i{height:5px;flex:1;border-radius:5px;background:var(--line2)}
.ob .steps i.on{background:var(--a)}
.banner{background:var(--a);color:#fff;font-size:.85em;padding:8px 16px;text-align:center;position:sticky;top:0;z-index:40}
.banner a{color:#fff;font-weight:500}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.themes button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 6px 7px;font-size:.78em;display:flex;flex-direction:column;align-items:center;gap:6px}
.themes button.on{border-color:var(--ink)}
.themes .sw{display:flex;width:100%;height:22px;border-radius:7px;overflow:hidden}
.themes .sw i{flex:1}

/* ------------------------------------------------ responsive */
@media (max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.minis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:980px){
  .g2,.g3,.g21,.g12{grid-template-columns:minmax(0,1fr)}
  .main{padding:24px 22px 120px}
}
@media (max-width:760px){
  .side{display:none}
  .main{padding:16px 14px 110px;max-width:none}
  h1{font-size:1.55em}
  .big{font-size:3.2em}
  .card>.body{padding:15px 15px}
  .card>.band{padding:10px 14px}
  .topbar{margin-bottom:14px;align-items:flex-start}
  .topbar .acts .hide-m{display:none}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .tile b{font-size:1.4em}
  .minis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .donutwrap{flex-direction:column;align-items:stretch}.donutwrap svg{align-self:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .tabbar a,.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink);text-decoration:none;padding:4px 6px;min-width:56px}
  .tabbar a svg,.tabbar button svg{width:21px;height:21px}
  .tabbar a.on{color:var(--a)}
  html[data-dark="1"] .tabbar a.on{color:var(--a2)}
  .tabbar .fab{width:52px;height:52px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px color-mix(in srgb,var(--a) 40%,transparent);min-width:0;padding:0}
  .tabbar .fab svg{width:24px;height:24px}
  .cday{min-height:54px;padding:4px}
  .ev{font-size:0;padding:0;height:5px;border-left:0;background:var(--a);border-radius:3px}
  .ev.income{background:var(--ok)}.ev.sub{background:var(--p3)}.ev.debt{background:var(--bad)}.ev.save{background:var(--b)}
  .ev.spend{font-size:9px;height:auto;background:none;color:var(--ink2)}
  .cal{gap:3px}
  .scrim{align-items:flex-end;padding:0}
  .modal{border-radius:24px 24px 0 0;max-height:94dvh;max-width:none}
  .toast{bottom:92px}
  .monthpick b{min-width:104px}
}
@media print{.side,.tabbar,.topbar .acts{display:none}.main{padding:0}}
.item>svg{width:18px;height:18px;flex:none;color:var(--ink3)}
.nextcard .body{flex-wrap:wrap}.nextcard .grow{flex:1 1 220px}
@media (max-width:760px){.nextcard .nbtns{width:100%;justify-content:flex-start!important;padding-left:58px}}
@media (max-width:760px){.topbar .simpletog{display:none}}
.obhead,.obrow{display:grid;grid-template-columns:34px minmax(0,1fr) 104px 150px 156px 34px;gap:8px;align-items:center}
.obhead{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:500;padding-bottom:6px}
.obrow{padding:7px 0;border-top:1px solid var(--line)}.obrow .e{text-align:center;font-size:1.15em}
.ob{max-width:760px}
@media (max-width:760px){.obhead{display:none}.obrow{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 34px;row-gap:6px}.obrow [data-obf=name]{grid-column:2/4}.obrow .iconbtn{grid-column:4;grid-row:1}.obrow [data-obf=amount]{grid-column:2}.obrow select{grid-column:3}.obrow [data-obf=next]{grid-column:2/4}}

/* ------------------------------------------------ debt payoff tracker */
.show-m{display:none!important}
.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}

<script>/* Debt Payoff Tracker engine: dates, balances, payoff simulation, this month's plan, progress. No DOM. */
const E = (() => {
  // ------------------------------------------------------------ dates (local, 'YYYY-MM-DD')
  const pad = n => String(n).padStart(2, "0");
  const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
  const diff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
  const dim = (y, m) => new Date(y, m + 1, 0).getDate();
  const ym = s => s.slice(0, 7);
  const addMonths = (s, n, day) => {
    const d = pd(s); const y = d.getFullYear(), m = d.getMonth() + n;
    const yy = y + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
    return `${yy}-${pad(mm + 1)}-${pad(Math.min(day || d.getDate(), dim(yy, mm)))}`;
  };
  const monthStart = s => s.slice(0, 8) + "01";
  const monthEnd = s => { const d = pd(s); return `${s.slice(0, 8)}${pad(dim(d.getFullYear(), d.getMonth()))}`; };
  const ymAdd = (m, n) => addMonths(m + "-01", n, 1).slice(0, 7);
  const r2 = v => Math.round(v * 100) / 100;
  const sum = (a, f = x => x) => a.reduce((s, x) => s + (+f(x) || 0), 0);
  const dueIn = (m, day) => { const [y, mo] = m.split("-").map(Number); return `${m}-${pad(Math.min(day || 1, dim(y, mo - 1)))}`; };

  // ------------------------------------------------------------ balances
  // A debt is {balance, asOf, asTs} plus history entries {date, amount, ts, kind:'pay'|'charge'|'inbal'}.
  // 'inbal' = a payment already included in the balance the user typed (counts as paid, not subtracted again).
  const after = (d, h) => h.date > (d.asOf || "0") || (h.date === d.asOf && (h.ts || 0) > (d.asTs || 0));
  function bal(d, t) {
    let b = +d.balance || 0;
    (d.history || []).forEach(h => {
      if (h.date > t || !after(d, h)) return;
      if (h.kind === "charge") b += +h.amount; else if (h.kind !== "inbal") b -= +h.amount;
    });
    return Math.max(0, r2(b));
  }
  const paidIn = (d, from, to) => sum((d.history || []).filter(h => h.kind !== "charge" && h.date >= from && h.date <= to), h => h.amount);
  const chargedIn = (d, from, to) => sum((d.history || []).filter(h => h.kind === "charge" && h.date >= from && h.date <= to), h => h.amount);
  const paidOffOn = (d, t) => {
    if (bal(d, t) > 0.005) return null;
    const p = (d.history || []).filter(h => h.kind !== "charge" && h.date <= t).sort((a, b) => a.date < b.date ? -1 : 1);
    return p.length ? p[p.length - 1].date : d.asOf || d.created || t;
  };

  // ------------------------------------------------------------ payoff simulation
  const SORT = {
    snowball: (a, b) => a.bal - b.bal || b.apr - a.apr,
    avalanche: (a, b) => b.apr - a.apr || a.bal - b.bal,
    custom: (a, b) => (a.ord || 99) - (b.ord || 99) || a.bal - b.bal
  };
  // list: [{id, bal (start of this month), apr, min, ord, paid (already paid this month)}]
  // o: {extra, method, lump (one time, month 1), roll (false = each debt only gets its own minimum)}
  function sim(list, o = {}) {
    const D = list.filter(d => d.bal > 0.005).map(d => ({ ...d, bal: +d.bal, apr: +d.apr || 0, min: +d.min || 0 }));
    const res = { months: 0, interest: 0, order: [], payoff: {}, path: [r2(sum(D, d => d.bal))], sched: [], never: false };
    if (!D.length) return res;
    res.order = [...D].sort(SORT[o.method] || SORT.avalanche).map(d => d.id);
    const budget = sum(D, d => d.min) + Math.max(0, +o.extra || 0);
    let m = 0;
    while (D.some(d => d.bal > 0.005) && m < 600) {
      m++;
      const pay = {};
      D.forEach(d => { if (d.bal > 0.005) { const i = d.bal * d.apr / 1200; res.interest += i; d.bal += i; } });
      let pot = o.roll === false ? sum(D.filter(d => d.bal > 0.005), d => d.min) : budget + (m === 1 ? Math.max(0, +o.lump || 0) : 0);
      D.forEach(d => { if (d.bal > 0.005) { const p = Math.min(d.min, d.bal, Math.max(0, pot)); d.bal -= p; pot -= p; pay[d.id] = p; } });
      if (o.roll !== false) for (const id of res.order) {
        const d = D.find(x => x.id === id);
        if (d.bal > 0.005 && pot > 0.005) { const p = Math.min(pot, d.bal); d.bal -= p; pot -= p; pay[id] = (pay[id] || 0) + p; }
      }
      // this month: what was really paid already counts, even if it's more than the plan
      if (m === 1 && o.actual !== false) D.forEach(d => { const more = Math.min((+d.paid || 0) - (pay[d.id] || 0), d.bal); if (more > 0.005) { d.bal -= more; pay[d.id] = (pay[d.id] || 0) + more; } });
      D.forEach(d => { if (d.bal <= 0.005 && !res.payoff[d.id]) { d.bal = 0; res.payoff[d.id] = m; } });
      Object.keys(pay).forEach(k => { pay[k] = r2(pay[k]); });
      res.sched.push(pay);
      res.path.push(r2(sum(D, d => d.bal)));
      if (m >= 2 && res.path[m] >= res.path[m - 1] - 0.005) { res.months = Infinity; res.interest = Infinity; res.never = true; return res; }
    }
    res.months = m >= 600 ? Infinity : m;
    if (m >= 600) { res.never = true; res.interest = Infinity; }
    return res;
  }
  // the list for "now": each open debt with its balance at the start of this month
  function startList(st, t) {
    const from = monthStart(t);
    return (st.debts || []).map(d => {
      const b = bal(d, t), paid = paidIn(d, from, t);
      return { id: d.id, bal: r2(b + paid), now: b, apr: +d.apr || 0, min: +d.min || 0, ord: +d.order || 0, paid };
    }).filter(x => x.bal > 0.005);
  }
  function plan(st, t, o = {}) {
    const s = st.settings || {};
    return sim(startList(st, t), { extra: o.extra ?? s.extra, method: o.method || s.method, lump: o.lump || 0, roll: o.roll, actual: o.actual });
  }
  // month index (1 = this month) -> 'YYYY-MM'
  const monthOf = (t, i) => ymAdd(ym(t), i - 1);

  // this month's checklist
  function thisMonth(st, t) {
    const P = plan(st, t), m = ym(t), L = startList(st, t), first = P.sched[0] || {};
    const rows = L.map(x => {
      const d = st.debts.find(y => y.id === x.id), planned = first[x.id] || 0, rest = r2(Math.max(0, planned - x.paid));
      const later = planned < 0.005 && x.paid < 0.005;
      return { d, planned, paid: r2(x.paid), rest, due: dueIn(m, d.dueDay || 1), done: !later && rest < 0.005, later, focus: P.order[0] === x.id };
    }).sort((a, b) => a.later - b.later || a.done - b.done || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0));
    const act = rows.filter(r => !r.later);
    return { rows, act, total: r2(sum(act, r => r.planned)), paid: r2(sum(act, r => Math.min(r.paid, r.planned))), left: r2(sum(act, r => r.rest)), done: act.filter(r => r.done).length, P };
  }

  // ------------------------------------------------------------ progress
  function progress(st, t) {
    const ds_ = st.debts || [];
    const owed = r2(sum(ds_, d => bal(d, t)));
    const start = r2(sum(ds_, d => (+d.start || +d.balance || 0)) + sum(ds_, d => chargedIn(d, d.created || "0000", t)));
    const paid = r2(sum(ds_, d => paidIn(d, "0000-00-00", t)));
    const pct = start > 0 ? Math.min(1, Math.max(0, 1 - owed / start)) : 0;
    const open = ds_.filter(d => bal(d, t) > 0.005), gone = ds_.filter(d => bal(d, t) <= 0.005);
    const interestNow = r2(sum(open, d => bal(d, t) * (+d.apr || 0) / 1200));
    return { owed, start, paid, pct, open, gone, interestNow };
  }
  const debtPct = (d, t) => { const s = +d.start || +d.balance || 0, c = chargedIn(d, d.created || "0000", t); return s + c > 0 ? Math.min(1, Math.max(0, 1 - bal(d, t) / (s + c))) : 1; };


  // ------------------------------------------------------------ streak: months in a row with a payment (this month may still be open)
  function streak(st, t) {
    const ms = new Set((st.debts || []).flatMap(d => (d.history || []).filter(h => h.kind !== "charge" && h.date <= t && +h.amount > 0).map(h => ym(h.date))));
    let m = ym(t), n = 0;
    if (!ms.has(m)) m = ymAdd(m, -1);
    while (ms.has(m)) { n++; m = ymAdd(m, -1); }
    return n;
  }
  // ------------------------------------------------------------ calendar: one entry per debt and month
  // status: paid | partial | due (still to pay, date not passed) | missed (date passed, nothing paid) | planned (future month) | later (nothing planned)
  function monthEntries(st, t, m, P) {
    P = P || plan(st, t); const cur = ym(t), out = [];
    const TM = m === cur ? thisMonth(st, t) : null;
    (st.debts || []).forEach(d => {
      const due = dueIn(m, d.dueDay || 1), from = m + "-01", to = monthEnd(from);
      if ((d.created || "0000") > to) return;
      const paid = r2(paidIn(d, from, to));
      if (m < cur) {
        const was = bal(d, addDays(from, -1)) > 0.005 || paid > 0;
        if (!was) return;
        out.push({ d, due, amount: paid, status: paid > 0 ? "paid" : (+d.min > 0 ? "missed" : "later") });
      } else if (m === cur) {
        const r = TM.rows.find(x => x.d.id === d.id); if (!r) { if (paid > 0) out.push({ d, due, amount: paid, status: "paid" }); return; }
        out.push({ d, due, amount: r.done ? r.paid : r.rest, planned: r.planned, paid: r.paid, status: r.later ? "later" : r.done ? "paid" : r.paid > 0 ? "partial" : due < t ? "missed" : "due" });
      } else {
        const i = (+m.slice(0, 4) - +cur.slice(0, 4)) * 12 + (+m.slice(5, 7) - +cur.slice(5, 7)), row = P.sched[i];
        const a = row ? row[d.id] || 0 : 0; if (a > 0.005) out.push({ d, due, amount: a, status: "planned" });
      }
    });
    return out.sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
  }
  const weightedApr = (st, t) => { const o = (st.debts || []).map(d => [bal(d, t), +d.apr || 0]); const b = sum(o, x => x[0]); return b > 0 ? sum(o, x => x[0] * x[1]) / b : 0; };

    bal, paidIn, chargedIn, paidOffOn, sim, startList, plan, monthOf, thisMonth, progress, debtPct, SORT, streak, monthEntries, weightedApr };
})();

/* example data for the demo: about 9 months of paying off 6 debts with the snowball method */

let modalOpen = null;
function modal(title, body, foot = "", opts = {}) {
  closeModal(true);
  const el = document.createElement("div");
  el.className = "scrim"; el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title.replace(/<[^>]+>/g, ""))}" style="${opts.wide ? "max-width:" + (opts.wide === true ? 640 : opts.wide) + "px" : ""}"><div class="mh"><h2>${title}</h2><button class="iconbtn" data-act="close" aria-label="Close">${ic("x")}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ""}</div>`;
  el.addEventListener("click", e => { if (e.target === el) closeModal(); });
  document.body.appendChild(el); modalOpen = el;
  const f = el.querySelector("[autofocus]"); if (f && matchMedia("(min-width:761px)").matches) setTimeout(() => { f.focus(); f.select && f.select(); }, 50);
  return el.querySelector(".modal");
}
function closeModal(silent) { if (modalOpen) { modalOpen.remove(); modalOpen = null; } }
addEventListener("keydown", e => { if (e.key === "Escape" && modalOpen) closeModal(); });
let toastT = null;
function toast(msg, act, label = "Undo") {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  t.innerHTML = `<span>${msg}</span>${act ? `<button>${label}</button>` : ""}`;
  if (act) t.querySelector("button").onclick = () => { act(); t.remove(); };
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), act ? 6500 : 3200);
}

function milestones(G) {

  out.push(["Debt-free 🕊️", !G.open.length, G.owed]);

}
function milestoneMini(G) {

function totalsCard(t, open, P) {

  const stack = `<div class="flow">${order.map(d => `<i style="flex:${Math.max(.001, E.bal(d, t))};background:${cols(d.id)}" data-tip="${esc(d.name + ": " + fmt0(E.bal(d, t)) + " · " + Math.round(E.bal(d, t) / owed * 100) + "%")}"></i>`).join("")}</div>

// ------------------------------------------------------------ payoff plan
function vPlan() {
  const t = today(), st = S.settings;
  if (!E.startList(S, t).length) return head("Your way out", "Payoff plan") + `<div class="empty">${S.debts.length ? "Every debt is paid off – there's nothing left to plan. 🕊️" : "Add a debt to see your plan."}</div>`;
  const P = E.plan(S, t, { lump: VS.lump }), P0 = E.plan(S, t, { extra: 0, roll: false, actual: false }), L = E.startList(S, t);
  const mins = E.sum(L, d => d.min), sooner = !P.never && !P0.never ? P0.months - P.months : null, saved = !P.never && !P0.never ? P0.interest - P.interest : null;
  const n = Math.min(Math.max(P.path.length, P0.never ? P.path.length * 2 : P0.path.length), 361);
  const v1 = Array.from({ length: n }, (_, i) => P.path[i] ?? 0), v0 = Array.from({ length: n }, (_, i) => P0.path[Math.min(i, P0.path.length - 1)] ?? 0);
  const lbl = i => mshort(E.monthOf(t, Math.max(1, i)));
  const chart = lineChart(v1, { h: 220, vals2: v0, color: "var(--a)", labels: [[0, "Now"], [Math.floor((n - 1) / 2), lbl(Math.floor((n - 1) / 2))], [n - 1, lbl(n - 1)]], tips: i => `${lbl(i)} · ${fmt0(v1[i])} left with your plan`, label: "What you owe over time" });
  const methods = [["snowball", "❄️ Snowball", "smallest balance first – quick wins"], ["avalanche", "🔥 Avalanche", "highest interest first – least interest"], ["custom", "✋ My order", "the order you choose"]];
  const comp = methods.map(([k, l, s]) => { const q = E.plan(S, t, { method: k, lump: VS.lump }); return `<button class="card pad mcard ${st.method === k ? "on" : ""}" data-act="method" data-v="${k}"><div class="row sb"><b>${l}</b>${st.method === k ? '<span class="badge">your plan</span>' : ""}</div><div class="serif" style="font-size:1.4em;margin-top:6px">${freeLabel(t, q)}</div><div class="tiny muted">${s}</div><div class="tiny" style="margin-top:6px">${q.never ? "–" : fmt0(q.interest)} interest</div></button>`; }).join("");

function owedChart(t, G, P) {

  const act = keys.map(k => S.hist[k]).concat([G.owed]), proj = P.path.slice(1, 1 + Math.max(6, Math.min(72, P.months === Infinity ? 12 : P.months)));
  const all = act.concat(proj), n = all.length, W = 640, H = 220, Lx = 56, T = 12, B = 24, w = W - Lx - 10, h = H - T - B;
  const hi = niceMax(Math.max(1, ...all)), X = i => Lx + (n > 1 ? w * i / (n - 1) : w / 2), Y = v => T + h - h * v / hi;

  const p = [act.length - 1, ...proj.map((_, i) => act.length + i)].map((i, k) => `${k ? "L" : "M"}${X(i).toFixed(1)},${Y(all[i]).toFixed(1)}`).join("");

  act.forEach((v, i) => { svg += `<circle cx="${X(i)}" cy="${Y(v)}" r="${i === act.length - 1 ? 5 : 3.4}" fill="var(--b)" stroke="var(--card)" stroke-width="1.5" data-tip="${esc(lab(i) + " · " + fmt0(v) + " owed")}"/>`; });
  [[0, "start"], [act.length - 1, "middle"], [n - 1, "end"]].forEach(([i, an]) => { if (i >= 0 && (i !== act.length - 1 || (act.length > 1 && i !== n - 1))) svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="${an}">${esc(i === act.length - 1 ? "Now" : lab(i))}</text>`; });

// ------------------------------------------------------------ calendar of due dates
const STAT = { paid: ["Paid", "ok"], partial: ["Part paid", "warn"], due: ["Upcoming", "a"], missed: ["Missed", "bad"], planned: ["Planned", "b"], later: ["Nothing due", ""] };
function vCalendar() {
  const t = today(), m = VS.cm || E.ym(t), P = E.plan(S, t), ent = E.monthEntries(S, t, m, P);
  const first = E.pd(m + "-01"), lead = (first.getDay() + 6) % 7, days = E.dim(first.getFullYear(), first.getMonth());
  let cells = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<div class="dow">${d}</div>`).join("") + Array(lead).fill('<div class="cday out"></div>').join("");
  for (let i = 1; i <= days; i++) {
    const ds = `${m}-${E.pad(i)}`, ev = ent.filter(e => e.due === ds && e.status !== "later");
    const logged = S.debts.flatMap(d => (d.history || []).filter(h => h.date === ds && h.kind !== "charge").map(h => ({ d, h })));
    cells += `<div class="cday ${ds === t ? "today" : ""}"><div class="d"><span>${i}</span>${logged.length ? `<i class="pdot" data-tip="${esc(logged.map(x => x.d.name + " " + fmt0(x.h.amount)).join(" · "))}"></i>` : ""}</div>${ev.map(e => `<div class="ev ${e.status}" data-tip="${esc(e.d.name + " · " + STAT[e.status][0] + (e.amount ? " · " + fmt0(e.amount) : ""))}">${esc(e.d.name)} ${e.amount ? fmt0(e.amount) : ""}</div>`).join("")}</div>`;
  }
  const leg = `<div class="hleg">${["paid", "due", "missed", "planned"].map(k => `<span><i class="lg ${k}"></i>${STAT[k][0]}</span>`).join("")}<span><i class="lg pd"></i>payment logged</span></div>`;
  // upcoming: next 90 days
  const end = E.addDays(t, 90), up = [];
  for (let k = 0; k < 4; k++) { const mm = E.ymAdd(E.ym(t), k); E.monthEntries(S, t, mm, P).forEach(e => { if (e.due >= t && e.due <= end && (e.status === "due" || e.status === "partial" || e.status === "planned")) up.push(e); }); }
  const overdue = E.monthEntries(S, t, E.ym(t), P).filter(e => e.status === "missed" || (e.status === "partial" && e.due < t));
  const row = e => `<div class="item">${dateBox(e.due, e.status === "missed" ? "a" : e.status === "planned" ? "" : "b")}<div class="grow"><div class="nm">${emojiOf(e.d)} ${esc(e.d.name)}</div><div class="tiny muted">${e.status === "missed" ? "due date passed – not logged yet" : rel(e.due) + (e.status === "partial" ? " · part paid" : "")}</div></div><span class="amt">${fmt0(e.amount)}</span>${E.ym(e.due) === E.ym(t) ? `<button class="btn sm pri" data-act="payNow" data-id="${e.d.id}" data-v="${e.amount}">${ic("check")}Paid</button>` : `<span class="badge b">planned</span>`}</div>`;
  const upl = `<div class="list">${overdue.map(row).join("")}${up.slice(0, 14).map(row).join("") || (overdue.length ? "" : `<div class="empty">Nothing due in the next 90 days.</div>`)}</div>`;
  const sum = ["paid", "due", "missed", "planned"].map(k => [k, ent.filter(e => e.status === k || (k === "due" && e.status === "partial"))]).filter(([, a]) => a.length);
  return head("Never miss a due date", "Calendar", `<div class="monthpick"><button class="iconbtn" data-act="cmPrev" aria-label="Previous month">${ic("left")}</button><b>${mname(m)}</b><button class="iconbtn" data-act="cmNext" aria-label="Next month">${ic("right")}</button></div>`, "Every due date, color-coded – paid, upcoming, missed or planned.") +
    `<div class="grid g21 start"><div class="col">${card(mname(m), `<div class="cal">${cells}</div>${leg}`, { tight: true, right: sum.map(([k, a]) => `<span class="badge ${STAT[k][1]}">${a.length} ${STAT[k][0].toLowerCase()}</span>`).join(" ") })}</div>
    <div class="col">${card("Upcoming payments · next 90 days", upl, { tight: true, b: true })}<div class="row wrap"><button class="btn sm" data-act="ics">${ic("cal")}Add due dates to my calendar</button></div></div></div>`;
}

/* forms: helpers, add/edit debt, log a payment, update balance, history, calendar file */
const num = v => { if (v == null) return NaN; let s = String(v).trim().replace(/[^\d,.\-]/g, ""); if (/,\d{1,2}$/.test(s) && !/\.\d/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, ""); return parseFloat(s); };
const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };

const moneyInp = (id, v, o = {}) => inp(id, v === "" || v == null ? "" : String(E.r2(+v)), { ...o, num: true, ph: o.ph || "0.00" });

  [/mom|dad|mum|family|friend|parents|brother|sister/i, "family"], [/loan/i, "personal"]];

function debtModal(d) {

}
function historyList(d) {

function saveDebt(id) {
  const t = today(), name = val("dN").trim(), b = num(val("dB")), min = num(val("dM")) || 0, due = clamp(parseInt(val("dD")) || 1, 1, 31), st = num(val("dS"));
  if (!name) return bad("Give it a name."); if (!(b >= 0)) return bad("Type what you owe.");
  commit(() => {
    let d = id && S.debts.find(x => x.id === id);
    const base = { name: name.slice(0, 40), type: val("dT"), apr: Math.max(0, num(val("dR")) || 0), min: E.r2(Math.max(0, min)), dueDay: due, order: parseInt(val("dO")) || 0, limit: Math.max(0, E.r2(num(val("dL")) || 0)) };
    if (!d) { d = { id: uid(), created: t, history: [], balance: E.r2(b), asOf: t, asTs: now(), start: st > b ? E.r2(st) : E.r2(b), ...base }; S.debts.push(d); }
    else {

      d.start = st > 0 ? E.r2(st) : Math.max(d.start || 0, d.balance);
    }
  }, id ? "edit debt" : "add debt");
  closeModal(); render(); if (!id) toast(`${esc(name)} added.`, () => undo());
}

function savePay() {

// adds a history entry, then celebrates whatever it unlocked
function addEntry(d, h) {
  const t = today(), before = E.progress(S, t), wasOpen = E.bal(d, t) > 0.005;
  commit(() => { d.history = d.history || []; d.history.push({ id: uid(), ts: now(), ...h }); }, h.kind === "charge" ? "charge" : "payment");
  const after = E.progress(S, t), gone = wasOpen && E.bal(d, t) <= 0.005;

  else if (gone) { confetti(); toast(`🎉 ${esc(d.name)} is paid off!`, () => undo()); }

// ------------------------------------------------------------ due dates as a calendar file
function icsFile() {
  const t = today(), open = S.debts.filter(d => E.bal(d, t) > 0.005);
  if (!open.length) return toast("No open debts to add.");
  const stamp = new Date(now()).toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const ev = open.map(d => {
    let first = E.dueIn(E.ym(t), d.dueDay || 1); if (first < t) first = E.dueIn(E.ymAdd(E.ym(t), 1), d.dueDay || 1);
    const day = Math.min(d.dueDay || 1, 28), dt = first.replace(/-/g, "");
    return ["BEGIN:VEVENT", `UID:${d.id}-due@truehaven-debt`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dt}`, `RRULE:FREQ=MONTHLY;BYMONTHDAY=${(d.dueDay || 1) > 28 ? -1 : day}`,
      `SUMMARY:${(d.name + " payment due").replace(/[,;]/g, " ")}`, `DESCRIPTION:Minimum ${fmt(d.min).replace(/[,;]/g, "")} – log it in your Debt Payoff Tracker`,
      "BEGIN:VALARM", "TRIGGER:-P2D", "ACTION:DISPLAY", "DESCRIPTION:Payment due in 2 days", "END:VALARM", "END:VEVENT"].join("\r\n");
  });
  download(new Blob([["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TrueHaven Studios//Debt Payoff Tracker//EN", "CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n")], { type: "text/calendar" }), "debt-due-dates.ics");
  toast("Calendar file downloaded – open it to add the due dates (with a reminder 2 days before).");
}

function confetti(small) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["var(--a)", "var(--b)", "var(--p1)", "var(--p2)", "var(--p3)", "var(--p5)", "var(--p7)"];
  for (let i = 0; i < (small ? 40 : 90); i++) {
    const p = document.createElement("i");
    p.style.cssText = `left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-delay:${Math.random() * .5}s;animation-duration:${1.8 + Math.random() * 1.4}s;transform:rotate(${Math.random() * 360}deg);width:${6 + Math.random() * 6}px;height:${8 + Math.random() * 8}px`;
    box.appendChild(p);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4000);
}

  delPay: d => { const x = debt(d.id); commit(() => { x.history = x.history.filter(h => h.id !== d.h); }, "delete payment"); debtModal(x); toast("Payment deleted.", () => { undo(); closeModal(); }); },
  upBal: d => balModal(debt(d.id)),
  saveBal: d => { const x = debt(d.id), b = num(val("ubB")); if (!(b >= 0)) return bad("Type what you owe."); commit(() => { Object.assign(x, { balance: E.r2(b), asOf: today(), asTs: now() }); if (b > (x.start || 0)) x.start = E.r2(b); }, "balance"); closeModal(); toast(`${esc(x.name)}: ${fmt(b)} – plan updated.`, () => undo()); },
  ics: () => { if (DEMO) return toast("Calendar reminders work in the full tracker."); icsFile(); },
  // payments
  pay: d => payModal(d.id), savePay: () => savePay(),
  payKind: d => { PAYK = d.v; document.querySelectorAll(".kind button").forEach(b => b.classList.toggle("on", b.dataset.v === d.v)); $(".modal h2").textContent = d.v === "charge" ? "Add a new charge" : "Log a payment"; $("#pPlan").classList.toggle("hidden", d.v === "charge"); },
  payDebt: d => { PAYD = d.id; document.querySelectorAll(".modal .cats .cat").forEach(b => b.classList.toggle("on", b.dataset.id === d.id)); $("#pPlan").innerHTML = planBtn(d.id, +d.rest); },
  payFill: d => { const a = $("#pA"); a.value = E.r2(+d.v); a.focus(); },
  payNow: d => { const x = debt(d.id); addEntry(x, { kind: "pay", amount: E.r2(+d.v), date: today(), note: "" }); },
  payMore: d => { const x = debt(d.id); modal(esc(x.name), `<p class="small muted" style="margin-top:0">${+d.v > 0 ? `This month's plan: ${fmt(+d.v)} still to pay.` : "Nothing planned for this one this month."}</p>
      <div class="list"><button class="item click opt" data-act="payOther" data-id="${d.id}" data-v="${d.v}"><div class="emo">✏️</div><div class="grow"><div class="nm">I paid a different amount</div><div class="tiny muted">more, less, or on another day</div></div></button>
       ${+d.v > 0 ? `<button class="item click opt" data-act="payInBal" data-id="${d.id}" data-v="${d.v}"><div class="emo">✓</div><div class="grow"><div class="nm">Already paid – it's in the balance I typed</div><div class="tiny muted">ticks it off without changing what you owe</div></div></button>` : ""}
      <button class="item click opt" data-act="upBal" data-id="${d.id}"><div class="emo">🧾</div><div class="grow"><div class="nm">Update the balance from my statement</div><div class="tiny muted">interest or new charges changed it</div></div></button></div>`); },
  payOther: d => { closeModal(); payModal(d.id, +d.v); },
  payInBal: d => { const x = debt(d.id); closeModal(); commit(() => { x.history.push({ id: uid(), ts: now(), kind: "inbal", amount: E.r2(+d.v), date: today(), note: "" }); }, "tick off"); toast(`${esc(x.name)} ticked off for this month.`, () => undo()); },
  // plan
  method: d => { S.settings.method = d.v; save(); render(); },
  allMonths: () => { VS.all = !VS.all; render(); },
  mv: d => { const P = E.plan(S, today()), o = [...P.order], i = o.indexOf(d.id), j = i + +d.v; if (i < 0 || j < 0 || j >= o.length) return;
    commit(() => { [o[i], o[j]] = [o[j], o[i]]; o.forEach((id, k) => { debt(id).order = k + 1; }); S.settings.method = "custom"; }, "order"); toast("Your own order – switched to “My order”.", () => undo()); },
  cmPrev: () => { VS.cm = E.ymAdd(VS.cm || E.ym(today()), -1); render(); }, cmNext: () => { VS.cm = E.ymAdd(VS.cm || E.ym(today()), 1); render(); },
  hf: d => { VS.hf = d.v; render(); },
  shape: d => { S.settings.shape = d.v; save(); render(); },
  exportCsv: () => { if (DEMO) return toast("Export works in the full tracker."); exportCsv(); },
  // data
  backup: () => backup(), restore: () => { if (DEMO) return toast("This works in the full tracker."); restore(); }, share: () => shareBackup(), install: () => installApp(),
  resetAll: () => { modal("Start fresh?", `<p>This deletes everything in the tracker on this device. Download a backup first if you might want it back.</p>`, `<button class="btn" data-act="backup">Download a backup</button><button class="btn danger" data-act="resetOk">Delete everything</button>`); },
  resetOk: () => { if (DEMO) return toast("Not in the demo."); const keep = { theme: S.settings.theme, currency: S.settings.currency }; S = blank(); Object.assign(S.settings, keep); OB = { step: 0, d: {} }; flush(); closeModal(); location.hash = ""; render(); },
  setTheme: d => { if (!S.setup && !DEMO) obCollect(); S.settings.theme = d.v; save(); render(); }, setDark: d => { S.settings.dark = d.v; save(); render(); },
  // onboarding
  obAdd: d => { obCollect(); OB.d.debts.push(obRow(d.n)); render(); const rows = document.querySelectorAll('.obrow [data-obf="' + (d.n ? "balance" : "name") + '"]'); rows.length && rows[rows.length - 1].focus(); },
  obDel: d => { obCollect(); OB.d.debts.splice(+d.i, 1); if (!OB.d.debts.length) OB.d.debts.push(obRow("")); render(); },
  obNext: () => { obCollect(); if (OB.step === 1 && !obDebts().length) return toast("Add at least one debt with a name and what you owe."); OB.step++; render(); },
  obBack: () => { obCollect(); OB.step--; render(); }, obDone: () => obFinish(),
  obExtraSet: d => { OB.d.extra = d.v; $("#obExtra").value = d.v; $("#obRes").innerHTML = obPlan(); },
  obMethod: d => { OB.d.method = d.v; $("#obRes").innerHTML = obPlan(); },
  obSample: () => { const s = window.BP_SAMPLE(); s.settings.theme = S.settings.theme; s.settings.currency = val("obCur") || S.settings.currency; S = migrate(s); S.setup = true; S.sample = true; save(); go("home"); render(); toast("This is example data – Settings › Start fresh clears it."); },
  undo: () => undo()
};

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) { if (e.target.closest(".modal a")) closeModal(); return; }
  const f = ACT[a.dataset.act]; if (!f) return;
  e.preventDefault(); f(a.dataset, a);
});
let qT = null;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "extra") { S.settings.extra = +el.value; save(); clearTimeout(qT); qT = setTimeout(render, 30); return; }
  if (el.id === "lump") { VS.lump = +el.value; clearTimeout(qT); qT = setTimeout(render, 30); return; }
  if (el.id === "obExtra") { OB.d.extra = el.value; clearTimeout(qT); qT = setTimeout(() => { const r = $("#obRes"); if (r) r.innerHTML = obPlan(); }, 120); return; }
  if (el.dataset.obf === "name") { const e2 = el.closest(".obrow")?.querySelector(".e"); if (e2) e2.textContent = typeOf(guessType(el.value))[2]; }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.set) { setSetting(el.dataset.set, el.value); render(); return; }
});
addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !modalOpen) { e.preventDefault(); undo(); } });

// service worker for offline use (only when served over http/https)
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol) && !window.BP_NO_SW) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => { }));
render();
</script>
</body></html>
